<!-- Framesets are how a great many of these systems are still laid out.
     Keeping one here means the automation has to cope with frame traversal
     rather than assuming a single flat document. -->
<html>
<head><title>Meridian Core - Servicing Console</title></head>
<frameset cols="170,*" border="1" frameborder="1">
  <frame name="navFrame" src="/nav" scrolling="auto">
  <frame name="mainFrame" src="/main" scrolling="auto">
  <noframes><body>This application requires frame support.</body></noframes>
</frameset>
</html>
