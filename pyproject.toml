[project]
name = "cua"
version = "0.1.0"
description = "Record-once / replay-many computer-use automation for applications with no API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",       # discovery-time LLM driver
    "playwright>=1.47",      # web surface transport (a11y tree + CDP)
    "pydantic>=2.8",         # artifact schema: typed, versioned, JSON-Schema-emitting
    "python-dotenv>=1.0",    # local ANTHROPIC_API_KEY loading
    "fastapi>=0.115",        # mockbank: the legacy target application
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",             # the guardrail policy is a file a reviewer reads
    "python-multipart>=0.0.9",  # form parsing for the mock app's POST screens
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6"]

[project.scripts]
cua = "cua.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Both the library and the target application are installed. mockbank is not
# part of the system -- it is the console the system automates -- but it has to
# be importable for `cua serve-mock` to work from any directory. Relying on the
# repository root happening to be on sys.path worked under pytest, which puts it
# there, and failed for the installed console script, which does not.
where = ["src", "."]
include = ["cua*", "mockbank*"]

[tool.setuptools.package-data]
mockbank = ["templates/*.html", "static/*.css"]

[tool.mypy]
# Checked, not aspirational: `mypy src/cua` is clean. Third-party stubs are
# not required, because the value here is catching our own type errors -- and
# it did, twice: a list inferred from its first element could not have held
# the fallback targeting strategy, and an action variable inferred from its
# first branch could not have held any other action.
files = ["src/cua"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # the reference capability is shared by several test modules
